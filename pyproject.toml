[project]
name = "llm-taskgen-prototype"
version = "0.1.0"
description = "Prototype: LLM agents generate olympiad-style math tasks for grades 1-4 (see SPEC.md)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic",
    "jsonschema",
    "psycopg[binary]",
    "pyyaml",
    "textstat",
]

[dependency-groups]
dev = [
    "pytest",
]

# src layout: the taskgen package in src/taskgen/ is installed editable by `uv sync` (decision D35).
# Exact versions only: the build backend is pinned to the same version as uv.
[build-system]
requires = ["uv_build==0.12.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "taskgen"

[tool.pytest.ini_options]
testpaths = ["tests"]
