[project]
name = "llm-taskgen-prototype"
version = "0.1.0"
description = "Prototype: LLM agents generate Kangaroo-style math tasks for grades 1-4 (see SPEC.md)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic",
    "jsonschema",
    "psycopg[binary]",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
