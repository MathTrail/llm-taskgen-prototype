# Prototype settings (SPEC 8). Values are rough and get tuned after the first runs.

agents:
  tutor:     { provider: anthropic, model: claude-haiku-4-5 }
  generator: { provider: anthropic, model: claude-opus-5, effort: high }
  analyst:   { provider: anthropic, model: claude-sonnet-5, effort: medium }
  skeptic:   { provider: anthropic, model: claude-sonnet-5, effort: medium }

max_attempts: 3

pace:                 # thresholds for the pace tag in --answer mode
  fast_below_sec: 60
  struggled_above_sec: 180

rating:               # Elo + IRT (SPEC 5.6): each parameter has its own K = k0 / (1 + decay * n)
  k0_student: 0.2     # overall level theta: slower than the topic offset (D37)
  k0_topic: 0.4       # topic offset delta
  k0_task: 0.4        # task difficulty beta
  decay: 0.05
  corridor: [0.70, 0.85]

sandbox:
  timeout_sec: 10
  memory_mb: 256

readability:
  max_grade_margin: 1 # Flesch-Kincaid grade at most the student's grade + 1

near_duplicate:
  max_similarity: 0.6 # pg_trgm similarity threshold
