# Prototype settings (SPEC 8). Values are rough and get tuned after the first runs.

agents:               # thinking: adaptive and effort work on Claude 5 models; Haiku 4.5 takes neither (D41)
  tutor:     { provider: anthropic, model: claude-haiku-4-5, max_tokens: 4096 }
  generator: { provider: anthropic, model: claude-opus-5, effort: high, thinking: adaptive, fallbacks: default, max_tokens: 32000 }
  analyst:   { provider: anthropic, model: claude-sonnet-5, effort: medium, thinking: adaptive, max_tokens: 16000 }
  skeptic:   { provider: anthropic, model: claude-sonnet-5, effort: medium, thinking: adaptive, max_tokens: 16000 }

llm:
  max_retries: 4      # the SDK retries connection errors, 408, 409, 429 and 5xx with backoff
  timeout_sec: 600    # per request; answers are streamed

prices:               # USD per million tokens, platform.claude.com/docs/en/about-claude/pricing (2026-09-15)
  claude-opus-5:    { input: 5.00, cache_write: 6.25, cache_read: 0.50, output: 25.00 }  # cache_write: 5-minute cache
  claude-opus-4-8:  { input: 5.00, cache_write: 6.25, cache_read: 0.50, output: 25.00 }  # a fallback of claude-opus-5
  claude-sonnet-5:  { input: 2.00, cache_write: 2.50, cache_read: 0.20, output: 10.00 }
  claude-haiku-4-5: { input: 1.00, cache_write: 1.25, cache_read: 0.10, output: 5.00 }

max_attempts: 3

pace:                 # thresholds for the pace tag in --answer mode
  fast_below_sec: 60
  struggled_above_sec: 180

rating:               # Elo + IRT (SPEC 5.6): each parameter has its own K = k0 / (1 + decay * n)
  k0_student: 0.2     # overall level theta: slower than the topic offset (D37)
  k0_topic: 0.4       # topic offset delta
  k0_task: 0.4        # task difficulty beta
  decay: 0.05
  corridor: [0.70, 0.85]

sandbox:              # solver_code runs here without network (SPEC 5.3)
  image: python:3.12.14-slim-trixie@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
  timeout_sec: 10     # counts from docker run, container start included
  memory_mb: 256
  cpus: 1

readability:          # measured on the question text (D38)
  max_grade_margin: 3 # Flesch-Kincaid grade at most the student's grade + 3
  max_sentence_words: { "1-2": 20, "3-4": 25 }  # longest sentence, by grade level

near_duplicate:
  max_similarity: 0.6 # pg_trgm similarity threshold
